<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>SlopGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="sg-popup">
    <!-- Header -->
    <header class="sg-popup-header">
      <div class="sg-popup-title">
        <svg class="sg-logo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span>SLOPGUARD</span>
      </div>
      <div class="sg-status-badge" id="statusBadge">
        <span class="sg-status-dot" id="statusDot"></span>
        <span id="statusText">Nonaktif</span>
      </div>
    </header>

    <!-- Inspector Toggle -->
    <section class="sg-popup-section">
      <div class="sg-toggle-row">
        <div class="sg-toggle-info">
          <span class="sg-toggle-label">Mode Inspector</span>
          <span class="sg-toggle-hint" id="shortcutHint">Alt+Shift+S</span>
        </div>
        <button class="sg-toggle" id="inspectorToggle" role="switch" aria-checked="false" aria-label="Toggle Inspector Mode">
          <span class="sg-toggle-track">
            <span class="sg-toggle-thumb"></span>
          </span>
        </button>
      </div>
    </section>

    <!-- Quick Model Select -->
    <section class="sg-popup-section" style="padding-top: 0; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
      <div class="sg-toggle-row" style="margin-bottom: 4px;">
        <span class="sg-toggle-label" style="font-size: 11px; opacity: 0.7;">AI Provider & Model</span>
      </div>
      <select id="quickModelSelect" class="sg-quick-select">
        <optgroup label="Google Gemini">
          <option value="gemini|gemini-3.7-flash">Gemini 3.7 Flash (Cepat)</option>
          <option value="gemini|gemini-2.5-pro">Gemini 2.5 Pro (Pintar)</option>
        </optgroup>
        <optgroup label="Groq (Llama 3)">
          <option value="groq|llama-3.1-8b-instant">Llama 3.1 8B (Cepat)</option>
          <option value="groq|llama-3.3-70b-versatile">Llama 3.3 70B (Pintar)</option>
        </optgroup>
        <optgroup label="Ollama (Lokal)">
          <option value="ollama|llama3">Llama 3 (Lokal)</option>
          <option value="ollama|phi3">Phi-3 (Lokal)</option>
          <option value="ollama|qwen2">Qwen 2 (Lokal)</option>
        </optgroup>
      </select>
    </section>

    <!-- Action Buttons -->
    <section class="sg-popup-section sg-action-section">
      <button class="sg-btn sg-btn-primary" id="auditPageBtn" title="Pindai seluruh teks di halaman ini sekaligus">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Audit Halaman Ini
      </button>
      <button class="sg-btn sg-btn-secondary" id="auditSiteBtn" title="Ambil screenshot dan analisa desain visual halaman">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
        </svg>
        Audit Desain (Visual)
      </button>
    </section>

    <!-- Last Audit Summary -->
    <section class="sg-popup-section" id="summarySection" style="display: none;">
      <div class="sg-section-header">Ringkasan Terakhir</div>
      <div class="sg-summary-card" id="summaryCard">
        <div class="sg-summary-url" id="summaryUrl"></div>
        <div class="sg-summary-row">
          <span class="sg-summary-score" id="summaryScore"></span>
          <span class="sg-summary-badge" id="summaryBadge"></span>
        </div>
        <div class="sg-summary-time" id="summaryTime"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="sg-popup-footer">
      <a href="#" class="sg-footer-link" id="settingsLink">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Pengaturan
      </a>
      <span class="sg-footer-divider"></span>
      <a href="#" class="sg-footer-link" id="historyLink" style="opacity: 0.4; pointer-events: none;" title="Segera hadir">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Riwayat
      </a>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
